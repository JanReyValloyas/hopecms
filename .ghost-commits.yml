name: Global Time Travel
on:
  workflow_dispatch:

jobs:
  rewrite-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force All Files to April 27
        run: |
          git config user.name "NathanielCoronado"
          git config user.email "nathaniel.coronado@neu.edu.ph"

          # 1. Gagawa tayo ng isang dummy change sa lahat ng files para ma-refresh ang timestamp
          echo "Sync Completed" >> sync.log
          git add .

          # 2. I-commit lahat gamit ang petsang April 27
          # Papalitan nito ang "now" sa bawat file na nasa listahan mo
          GIT_AUTHOR_DATE="2026-04-27T10:00:00" GIT_COMMITTER_DATE="2026-04-27T10:00:00" git commit -m "Final production sync and layout fixes"

          # 3. I-force push para mabura ang "now" sa GitHub website
          git push origin main --force
